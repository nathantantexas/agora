name: Deploy to GitHub Pages

# Publishes the web app so anyone with access to the repository can open it at a URL
# instead of running it locally. The map, city guides, rankings, and charts all read
# bundled data, so they work with no server. Headlines are gathered here at build time,
# since a static site cannot run the news endpoint itself; the scheduled run below keeps
# them current. Address lookup and the AI explanations still need the API and fall back
# to their offline behavior.

on:
  push:
    branches: [main]
  schedule:
    # A few times a day, so the published headlines do not go stale between commits.
    - cron: '17 5,11,17,23 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Gather current headlines
        run: npm run build:news

      - name: Build for the repository subpath
        # GITHUB_REPOSITORY is owner/repo and is set for every trigger, including the
        # scheduled runs where the event payload differs from a push.
        run: VITE_BASE="/${GITHUB_REPOSITORY##*/}/" npm run build
        env:
          # No server is deployed alongside this build, so the news page reads the
          # snapshot directly instead of trying the API first.
          VITE_STATIC_DEPLOY: '1'

      - name: Add the SPA fallback and disable Jekyll
        # Pages serves 404.html for any path it does not recognize, which is how a
        # client-routed deep link such as /cities reaches the app instead of a 404.
        run: |
          cp packages/web/dist/index.html packages/web/dist/404.html
          touch packages/web/dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
