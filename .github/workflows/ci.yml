name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check dictionary parity across languages
        run: node scripts/i18n-check.mjs

      - name: Run the test suites
        run: npm test

      - name: Build the web app
        run: npm run build
